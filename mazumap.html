<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>全台媽祖廟打卡地圖</title>
<style>
.ic{width:1.1em;height:1.1em;vertical-align:-.17em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button span .ic{width:30px;height:30px}h1 .ic{width:1.05em;height:1.05em;vertical-align:-.12em}

:root{--bg:#fbf5e9;--ink:#2a1a14;--sub:#6b5a50;--red:#a8261c;--red2:#8a1d15;--gold:#c8962e;--green:#2e7d4f;--card:#fff;--line:#e4d6bd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:20px;line-height:1.5}
#app{display:flex;flex-direction:column;height:100dvh}
header{background:var(--red);color:#fff;padding:12px 16px 10px;padding-top:max(12px,env(safe-area-inset-top))}
header h1{margin:0;font-size:24px;letter-spacing:1px}
.stat{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;font-size:17px;opacity:.95}
.stat .cl{background:rgba(255,255,255,.18);border-radius:20px;padding:2px 12px;white-space:nowrap}
main{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
nav{display:flex;background:#fff;border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 0 8px;font-size:19px;color:var(--sub);font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:0}
nav button span{font-size:28px;line-height:1.1}
nav button.on{color:var(--red);font-weight:700;background:#fbeee9}
.pad{padding:14px 14px 30px}
input[type=search],input[type=text],textarea,select{width:100%;font-size:21px;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-family:inherit}
textarea{min-height:130px;resize:vertical}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px}
.chip{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 18px;font-size:20px;font-family:inherit;color:var(--ink)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;font-family:inherit;color:var(--ink);font-size:20px}
.card:active{background:#fff3e0}
.mk{flex:0 0 52px;height:52px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.mk.ok{background:var(--green)}
.tx{flex:1;min-width:0}.tx b{display:block;font-size:22px}.tx span{display:block;font-size:17px;color:var(--sub)}
.go{font-size:17px;color:var(--green);font-weight:700;white-space:nowrap}
.big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:60px;border-radius:16px;border:0;font-size:23px;font-weight:700;font-family:inherit;margin:10px 0;text-decoration:none;padding:10px}
.big.red{background:var(--red);color:#fff}.big.red:active{background:var(--red2)}
.big.line{background:#fff;color:var(--red);border:2px solid var(--red)}
.big.plain{background:#efe6d3;color:var(--ink)}
.small{background:none;border:0;color:var(--sub);text-decoration:underline;font-size:17px;font-family:inherit;padding:10px 4px}
.note{font-size:17px;color:var(--sub);margin:16px 2px}
.prog{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin-top:10px;display:flex;align-items:center;gap:12px}
.bar{flex:1;height:14px;background:#efe6d3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.show{display:flex}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px;padding-bottom:max(22px,env(safe-area-inset-bottom))}
.panel h2{margin:0 0 2px;font-size:28px;color:var(--red)}.panel h3{margin:18px 0 4px;font-size:22px}
.sub{color:var(--sub);margin:2px 0 8px;font-size:18px}
.ci{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.ci img{width:100%;border-radius:10px;display:block;margin-bottom:8px}
.ci .d{font-size:16px;color:var(--sub)}.ci .t{white-space:pre-wrap;word-break:break-word;margin:4px 0}
.ci .who{font-weight:700;color:var(--red)}
label{display:block;font-weight:700;margin:14px 0 6px}
#prev img{width:100%;border-radius:12px;margin-top:8px}
#toast{position:fixed;left:50%;top:max(80px,env(safe-area-inset-top));transform:translateX(-50%);background:#222;color:#fff;padding:14px 22px;border-radius:14px;font-size:21px;z-index:50;display:none;max-width:90%;text-align:center}
#mapwrap{position:absolute;inset:0;background:#cfe6ee;touch-action:none;overflow:hidden}
#mapwrap svg{width:100%;height:100%;display:block}
.zb{position:absolute;right:12px;display:flex;flex-direction:column;gap:10px}
.zb button{width:60px;height:60px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:34px;font-weight:700;color:var(--red);font-family:inherit;box-shadow:0 2px 6px rgba(0,0,0,.2)}
#mapcard{position:absolute;left:10px;right:10px;bottom:10px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 3px 10px rgba(0,0,0,.25);display:none}
#mapcard.show{display:block}
#mapcard .row{display:flex;gap:10px}#mapcard .row .big{margin:8px 0 0;min-height:54px;font-size:21px}
.leg{position:absolute;left:10px;bottom:10px;line-height:1.5;background:rgba(255,255,255,.92);border-radius:12px;padding:6px 12px;font-size:17px}
.near{display:flex;justify-content:space-between;align-items:center;width:100%;margin:6px 0 0;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;font-family:inherit;font-size:20px;text-align:left;color:inherit}.near span{color:var(--sub);font-size:18px;white-space:nowrap;margin-left:8px}
.leg i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
</head>
<body><svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="i-lantern" viewBox="0 0 24 24"><path d="M12 2v3"/><rect x="5" y="5" width="14" height="13" rx="6"/><path d="M9 5.5c-1 3.5-1 8.5 0 12M15 5.5c1 3.5 1 8.5 0 12M12 5v13M9 18v1.5h6V18M12 19.5V22"/></symbol><symbol id="i-temple" viewBox="0 0 24 24"><path d="M2 9l10-6 10 6M4 9h16M6 9v10M10 9v10M14 9v10M18 9v10M3 21h18"/></symbol><symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></symbol><symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H14a3.5 3.5 0 0 0 0-7h-4a3.5 3.5 0 0 1 0-7h5.5"/></symbol><symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol><symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 0 1-.5-9 6 6 0 0 1 11.3 1.5A3.8 3.8 0 0 1 17.5 18z"/></symbol><symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></symbol><symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol><symbol id="i-save" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></symbol><symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></symbol><symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol><symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol></svg>
<div id="app">
  <header>
    <h1><svg class="ic" aria-hidden="true"><use href="#i-lantern"/></svg> 全台媽祖廟打卡地圖</h1>
    <div class="stat"><span id="cnt"></span><span class="cl" id="cloud">連線中…</span></div>
  </header>
  <main id="view"></main>
  <nav>
    <button data-tab="list"><span><svg class="ic" aria-hidden="true"><use href="#i-temple"/></svg></span>廟宇</button>
    <button data-tab="map"><span><svg class="ic" aria-hidden="true"><use href="#i-map"/></svg></span>地圖</button>
    <button data-tab="trail"><span><svg class="ic" aria-hidden="true"><use href="#i-route"/></svg></span>我的足跡</button>
  </nav>
</div>
<div id="sheet"><div class="panel" id="panel"></div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 資料 ---------- */
const COUNTY={
 '基隆市':['北部',121.74,25.13],'台北市':['北部',121.55,25.05],'新北市':['北部',121.55,24.95],'桃園市':['北部',121.20,24.95],
 '新竹市':['北部',120.97,24.80],'新竹縣':['北部',121.10,24.72],'宜蘭縣':['東部',121.70,24.65],
 '苗栗縣':['中部',120.85,24.50],'台中市':['中部',120.80,24.20],'彰化縣':['中部',120.50,24.00],'南投縣':['中部',120.95,23.90],'雲林縣':['中部',120.35,23.70],
 '嘉義市':['南部',120.45,23.48],'嘉義縣':['南部',120.50,23.45],'台南市':['南部',120.25,23.10],'高雄市':['南部',120.45,22.85],'屏東縣':['南部',120.60,22.55],
 '花蓮縣':['東部',121.40,23.80],'台東縣':['東部',121.10,23.00],
 '澎湖縣':['離島',119.58,23.57],'金門縣':['離島',118.33,24.45],'連江縣':['離島',119.98,26.16]
};
const REGIONS=['全部','北部','中部','南部','東部','離島'];
// id, 名稱, 縣市, 緯度, 經度, 簡短說明, 介紹(整理自旅遊與新聞資料,部分為傳說或廟方說法;座標為概略位置)
const RAW=[
 ["t01", "北港朝天宮", "雲林縣", 23.5681, 120.3047, "北港媽祖,全台知名", "相傳創建於清康熙33年(1694年),由僧人樹壁從湄洲奉請媽祖來台,是國定古蹟,常被視為台灣媽祖信仰的重要中心。廟裡的媽祖相傳坐鎮在古井之上,所以也叫「井上媽」。每年元宵節和農曆三月二十三媽祖誕辰最熱鬧,廟前中山路有很多小吃。", "北港鎮中山路178號"],
 ["t02", "新港奉天宮", "嘉義縣", 23.5565, 120.3479, "供奉「開臺媽祖」", "供奉「開臺媽祖」,和北港朝天宮一樣源自舊稱「笨港」的地方,兩間廟在歷史上有「誰才是正統」的說法。廟內保存不少清末民初的交趾陶等文物。每年農曆七月依古禮「封鐘鼓」,整個月不鳴鐘擊鼓。", "新港鄉新民路53號"],
 ["t03", "朴子配天宮", "嘉義縣", 23.4679, 120.2452, "樸樹媽,求子聞名", "原名「樸仔宮」,鎮殿媽祖由樸樹刻成,神像底下還連著樹根,有「請不動的媽祖婆」之稱。相傳建於1687年,現為縣定古蹟,以媽祖求子的「白花、紅花」習俗聞名。", "朴子市開元路118號"],
 ["t04", "麥寮拱範宮", "雲林縣", 23.7483, 120.2556, "麥寮最大媽祖廟", "麥寮鄉最大的媽祖廟,是當地的信仰中心,2012年列為國定古蹟。廟宇經過多年用傳統工法修復,2018年完工安座。", "麥寮鄉中正路3號"],
 ["t05", "鹿港天后宮", "彰化縣", 24.0593, 120.4314, "鹿港老街一帶", "鹿港老街的信仰中心,廟史四百多年,2019年升格為國定古蹟。廟方供奉湄洲「開基媽祖」,是鎮宮之寶。木雕、石雕和彩繪都很精彩,清晨六點就開廟門。", "鹿港鎮中山路430號"],
 ["t06", "彰化南瑤宮", "彰化縣", 24.0677, 120.5385, "笨港進香兩百多年", "彰化市的大廟,以「笨港進香」聞名:信徒從清嘉慶年間起,就徒步到笨港(北港、新港一帶)進香,延續兩百多年。廟內有多個「媽會」,輪流辦理進香。", "彰化市南瑤里南瑤路43號"],
 ["t07", "大甲鎮瀾宮", "台中市", 24.3452, 120.6236, "大甲媽祖遶境聞名", "相傳清雍正年間(1730年)從湄洲迎奉媽祖來台。每年農曆三月的「大甲媽祖遶境進香」長達九天八夜,是台灣規模最大的宗教活動之一,2011年被登錄為國家重要民俗。", "大甲區順天路158號"],
 ["t08", "台中萬和宮", "台中市", 24.1379, 120.639, "南屯老街", "位在南屯老街,是台中最古老的廟宇之一,主祀「老大媽」,相傳1726年由地方仕紳集資興建大廟。三年一次的「老二媽」西屯省親遶境是特色活動。", "南屯區萬和路一段51號"],
 ["t09", "台中樂成宮", "台中市", 24.1407, 120.698, "旱溪媽祖", "俗稱旱溪媽祖廟,在台中東區。每年農曆三月初一展開的「旱溪媽祖遶境大屯十八庄」約22天,是全台遶境天數最長的媽祖遶境之一,還有全女性的神轎班。", "東區旱溪街48號"],
 ["t10", "台南大天后宮", "台南市", 22.9966, 120.2016, "國定古蹟", "原本是明鄭時期寧靖王的府邸,清初改成媽祖廟,被認為是台灣第一座官建的媽祖廟,位在台南中西區永福路。廟裡也祀有月下老人。", "中西區永福路二段227巷18號"],
 ["t11", "安平開台天后宮", "台南市", 23.0007, 120.1607, "安平古堡附近", "相傳明鄭時期就在安平立廟,廟中三尊軟身媽祖據說隨鄭成功的船隊來台,所以稱「開台天后宮」。每四年舉行一次「上香山迎媽祖」遶境。", "安平區國勝路33號"],
 ["t12", "鹿耳門天后宮", "台南市", 23.0372, 120.1245, "安南區", "在台南安南區,和鄭成功從鹿耳門水道登陸台灣的故事有關。它和「鹿耳門聖母廟」是不同的兩間廟,都是安南區有名的媽祖廟。每年有煙火活動。", "安南區媽祖宮一街136號"],
 ["t13", "旗後天后宮", "高雄市", 22.6134, 120.2684, "旗津島上", "位在高雄旗津,是高雄市區最古老的媽祖廟,市定古蹟,廟史三百多年。旗津有「烏魚拜媽祖」的傳說:冬至後一段時間,漁民不再捕烏魚。", "旗津區廟前路93號"],
 ["t14", "屏東慈鳳宮", "屏東縣", 22.6709, 120.4863, "屏東夜市旁", "屏東市的信仰中心,旁邊就是屏東觀光夜市。據說建於1737年,原名「舊媽祖宮」,1825年改名慈鳳宮。", "屏東市中山路39號"],
 ["t15", "東港朝隆宮", "屏東縣", 22.4671, 120.4478, "蝦米媽", "建於1724年,東港人叫祂「蝦米媽」或「港郊媽」,保佑海上與陸路平安,常與北港朝天宮、竹南慈裕宮並稱「台灣三媽祖」。東港另有主祀王爺的東隆宮,是不同的廟。", "東港鎮延平路108號"],
 ["t16", "澎湖天后宮", "澎湖縣", 23.5647, 119.564, "相傳為全台最古老的媽祖廟", "在馬公,官方旅遊資料記載建於1604年,被稱為全台灣歷史最悠久的媽祖廟,「馬公」的地名也來自「媽宮」。廟內保存乾隆皇帝御賜「與天同功」金匾和古碑,後方就是馬公老街。", "馬公市正義街1號"],
 ["t17", "關渡宮", "台北市", 25.1177, 121.464, "北台灣古老媽祖廟", "創建於1712年,被稱為北台灣最古老的媽祖廟,有「南有北港媽、北有關渡媽」的說法。後山有鑿岩而建的「財神洞」。從捷運關渡站步行約15分鐘。", "北投區知行路360號"],
 ["t18", "淡水福佑宮", "新北市", 25.1703, 121.4399, "淡水老街旁,歷史悠久", "淡水最早的市街就是從這座媽祖廟發展起來的,位在淡水河邊,始建於清乾隆年間(1782年),與龍山寺、清水巖並稱淡水三大廟。近年曾進行整修,出發前建議先確認開放狀況。", "淡水區中正路200號"],
 ["t19", "新莊慈祐宮", "新北市", 25.0344, 121.4529, "新莊廟街", "新莊最古老的寺廟,創建於清康熙25年(1686年),新北市定古蹟,大家叫祂「新莊媽」。位在新莊廟街,有「一府、二鹿、三新莊」的繁華歷史。千里眼、順風耳將軍穿官服、戴官帽,是一大特色。", "新莊區新莊路218號"],
 ["t20", "松山慈祐宮", "台北市", 25.0512, 121.5777, "饒河街夜市旁", "始建於1753年,供奉黑面媽祖,舊稱「錫口媽祖宮」,就在饒河街觀光夜市旁。三川殿前的石獅已有兩百多年歷史。", "松山區八德路四段761號"],
 ["t21", "大稻埕慈聖宮", "台北市", 25.0602, 121.5121, "迪化街一帶", "位在台北大稻埕,靠近迪化街和大稻埕碼頭,廟前有道地小吃。逛迪化街、霞海城隍廟時可以順道參拜。", "大同區保安街49巷17號"],
 ["t22", "基隆慶安宮", "基隆市", 25.1294, 121.7406, "基隆媽祖廟", "俗稱基隆媽祖廟,在忠二路與孝一路口。最早是乾隆年間漳州移民在牛稠港附近蓋的小廟,後來遷建成現在的廟。農曆七月基隆中元祭的內壇設在這裡,廟內同時有漳州、泉州、湄洲三地的媽祖。", "仁愛區忠二路1號"],
 ["t23", "新竹長和宮", "新竹市", 24.8085, 120.965, "真髮媽祖", "在新竹北門街,供奉相傳以媽祖遺髮製成的「真髮媽祖」(湄洲祖廟正三媽)。市定古蹟,隔壁就是水仙宮。清代時是竹塹地區商人議事的地方。", "北區北門街135號"],
 ["t24", "竹南中港慈裕宮", "苗栗縣", 24.6826, 120.8635, "竹南內媽祖", "竹南的「內媽祖」,位在中港舊城區,常與東港朝隆宮、北港朝天宮並稱「台灣三媽祖」。每年端午有「祭江洗港」儀式,媽祖鑾轎遶境後衝向海口,已登錄為苗栗縣民俗無形文化資產。", "竹南鎮民生路7號"],
 ["t25", "竹南后厝龍鳳宮", "苗栗縣", 24.6937, 120.8665, "世界最高坐姿媽祖像", "竹南的「外媽祖」,廟後方有高約41公尺的巨大坐姿媽祖像,被稱為世界最高的坐姿媽祖像。廟方說法是1661年肇基,春節有乞龜祈福活動。神像內部是否開放,出發前建議先確認。", "竹南鎮龍安街69號"],
 ["t26", "白沙屯拱天宮", "苗栗縣", 24.5714, 120.7092, "白沙屯媽祖進香", "在苗栗通霄白沙屯。每年白沙屯媽祖徒步前往北港朝天宮進香,2010年登錄為國家級無形文化資產。粉紅色的鑾轎被稱為「粉紅超跑」,沿途有大批信眾隨行。", "通霄鎮白東里8號"],
 ["t27", "宜蘭昭應宮", "宜蘭縣", 24.7575, 121.7528, "台灣少見面向山的媽祖廟", "宜蘭市的老廟,1808年建廟,是古蹟。廟改成坐東朝西後,成為台灣少見面向山的媽祖廟。格局狹長,三川殿的石雕、木雕很精緻。", "宜蘭市中山路三段106號"],
 ["t28", "南方澳南天宮", "宜蘭縣", 24.5818, 121.8648, "金媽祖、玉媽祖", "位在南方澳漁港上方的半山腰,一樓供湄洲媽祖,二樓有玉媽祖,三樓有純金打造的金媽祖,是南方澳最具代表性的信仰地標。", "蘇澳鎮江夏路17號"],
 ["t29", "花蓮港天宮", "花蓮縣", 24.0075, 121.5875, "花蓮大型媽祖廟", "花蓮市區規模最大的廟宇之一,主祀湄洲大媽(港天媽),正殿前的龍柱階梯氣勢十足。廟方附設香客大樓。", "花蓮市中山路一段500巷15號"],
 ["t30", "台東天后宮", "台東縣", 22.7568, 121.1555, "後山媽祖", "清光緒年間倡建,1891年落成,是台東縣歷史悠久的信仰中心,據說是東台灣唯一的官廟。廟中有金媽祖,每年元宵有遶境活動。", "台東市中華路一段222號"],
 ["t31", "馬祖天后宮", "連江縣", 26.1583, 119.9182, "南竿馬港,離島(地圖未標示)", "位在南竿馬祖村(馬港)。傳說媽祖的遺體漂流到這裡,居民為感念她的孝心而立廟,「馬祖」列島的名字也由此而來。附近山上有高大的媽祖巨神像。", "南竿鄉馬祖村001鄰4之1號"]

4號",""],["m260","三舍照明宮","台南市",23.0904,120.2967,"新市區三舍一街51號",""],["m261","七股十份聖護宮","台南市",23.095,120.1047,"七股區十份里24-8號",""],["m262","麻豆油車仁厚宮","台南市",23.1905,120.2443,"麻豆區新生北路387號",""],["m263","後堀潭湄婆宮","台南市",23.1275,120.2549,"安定區蘇厝9之1號",""],["m264","三股龍德宮","台南市",23.0992,120.1182,"七股區三股里3鄰三股38號",""],["m265","佳里南勢慈聖宮","台南市",23.1484,120.1778,"佳里區南勢里佳南路366號",""],["m266","台南水仔尾開基天后祖廟","台南市",22.9997,120.2026,"北區自強街12號","被視為台灣最早的媽祖廟之一,有「開基天后祖廟」之稱,俗稱水仔尾媽祖廟。相傳明鄭永曆16年(1662年)由鄭成功把「媽祖寮仔」改建為廟,奉祀隨艦隊來台的「船仔媽」。"],["m267","白河福安宮","台南市",23.3507,120.4162,"白河區中山路124號",""],["m268","將軍青鯤鯓朝天宮","台南市",23.1901,120.091,"將軍區鯤鯓里236號",""],["m269","永康鹽行天后宮","台南市",23.0394,120.2356,"永康區中正南路690號","永康鹽行天后宮前身是洲仔尾天后宮，後來遷到鹽行。洲仔尾昔日是台江內海的港口，廟後保存一尊與鄭其仁墓有關的石馬，流傳著白馬作祟的傳說。"],["m270","港口慈安宮","台南市",23.0904,120.233,"安定區港南里20鄰161號",""],["m271","白河湄州宮","台南市",23.3488,120.4161,"白河區新起街31-3號",""],["m272","新市西福安宮","台南市",23.0896,120.2563,"新市區豐華里40號",""],["m273","六甲恒安宮","台南市",23.2307,120.3539,"六甲區仁愛街38號","六甲恒安宮奉祀「護軍媽」，是六甲當地知名的媽祖廟。廟體於1999年重建後入火安座，每五年舉行一次大型遶境，範圍涵蓋六甲十多個里與數十間宮廟。"],["m274","白河永安宮","台南市",23.3486,120.4123,"白河區國泰路145號",""],["m275","下營茅港尾天后宮","台南市",23.2167,120.283,"下營區茅營里163號","茅港尾天后宮供奉軟身媽祖「茅港媽」。茅港尾昔日是倒風內海的重要港口，北港媽祖赴台南進香途中都要在此過夜。1862年大地震重創茅港尾，廟宇後來在1975年重建完成；2019年恢復中斷百年的「赴郡會香」。"],["m276","鐵線橋通濟宮","台南市",23.2648,120.2767,"新營區鐵線橋42號",""],["m277","銀同祖廟","台南市",22.9901,120.2083,"中西區城隍街45號","銀同祖廟位於台南市中西區城隍街。所謂「銀同媽」，指的是源自福建同安的媽祖，銀同祖廟被列為台灣較早期興建的知名媽祖廟之一。"],["m278","仁德土庫天后宮","台南市",22.9882,120.2588,"仁德區土庫里土庫5街33號",""],["m279","麻豆護濟宮","台南市",23.1848,120.2461,"麻豆區光復路106號","麻豆護濟宮創建三百多年，主體建築也有兩百多年歷史，位於古倒風內海的麻豆港一帶。2009年登錄為歷史建築，修復後指定為台南市定古蹟，廟內留有陳玉峰大師的彩繪。"],["m280","楠梓天后宮","高雄市",22.7279,120.3301,"楠梓區楠梓路1號","楠梓天后宮位於楠梓舊街區，已有兩百三十多年歷史，是高雄市定古蹟。廟內的交趾陶、磚雕、剪黏與三川門石雕、木雕都極為精緻，主體結構與工藝保存了創建時的原貌。"],["m281","光華天福宮","高雄市",22.6165,120.3185,"苓雅區光華二路386-1號",""],["m282","鳳山雙慈殿","高雄市",22.6253,120.3578,"鳳山區三民路285-1號","淵源可追溯到清雍正末期,先建奉祀觀音的「觀音亭」;乾隆18年(1753年)增建前殿,從泉州迎請媽祖奉祀。"],["m283","燕巢麒麟尾天后宮","高雄市",22.8099,120.401,"燕巢區金山里麒麟巷10號",""],["m284","五甲龍成宮","高雄市",22.5944,120.3285,"鳳山區五甲二路730巷6號","相傳清康熙年間(約1673年)福建移民帶來媽祖香火,在五甲搭草壇供奉;光緒年間(1886年)三境主合祀並翻修成小廟。"],["m285","梓官蚵仔寮保安宮","高雄市",22.73,120.2558,"梓官區中正路230號","歷史可追溯到清乾隆8年(1743年),曾姓先祖從福建東石請媽祖來台,在下蚵仔寮定居;後因興建左營軍港,曾姓家族被迫遷到頂蚵仔寮、頂園仔(茄苳坑)一帶。"],["m286","高雄朝元宮(鐵路媽祖)","高雄市",22.6389,120.3094,"三民區鐵道二街1號","俗稱「鐵路媽祖」，起源約五十多年前：一名台鐵員工撿到信徒遺落在火車上的媽祖聖像，供奉在電線桿上，居民感念後合力蓋了不到兩張榻榻米大的小廟，是全台最小的媽祖廟之一。因鐵路地下化工程，聖像暫奉於臨時行館。"],["m287","頂鹽田天月宮","高雄市",22.7465,120.2766,"橋頭區頂鹽里南北路2號",""],["m288","鼓山德安宮","高雄市",22.6539,120.2991,"鼓山區中華一路2133巷45之1號",""],["m289","林園鳳芸宮","高雄市",22.4828,120.3976,"林園區鳳芸路78號","相傳清光緒年間,一艘來自南澳的貨船遇風浪,媽祖神像漂到中芸海灘;廟的海上遶境在全台相當獨特。"],["m290","內門順賢宮","高雄市",22.9125,120.4704,"內門區內南里菜園頂8號","順賢宮主祀天上聖母，2000年遷建至素有「台灣藝陣之鄉」美名的內門。廟方成立順賢宮宋江陣，並設宋江館傳承文化，每年春季舉辦的內門宋江陣聞名全台，香客大樓「益賢山莊」也很有名。"],["m291","橋頭筆秀天后宮","高雄市",22.7679,120.3122,"橋頭區筆秀路廟前巷4號",""],["m292","劉厝寶公宮","高雄市",22.781,120.2891,"岡山區劉厝路145號",""],["m293","蚵子寮朝天宮","高雄市",22.7288,120.2533,"梓官區廣澤路55-1號",""],["m294","岡山壽天宮","高雄市",22.7982,120.2911,"岡山區壽天里公園路40號","岡山壽天宮是岡山香火最盛的廟宇，廟方以1712年計為創建年，2025年慶祝創建313週年。2015年以兩萬五千個螺絲墊片與一萬三千個螺帽打造「螺絲媽祖」，呼應岡山的螺絲產業，是全球獨一無二的造型。"],["m295","鳳邑想思林瑞安宮","高雄市",22.6242,120.3696,"鳳山區中山東路213巷5號","神尊溯自清雍正2年(1724年),由盧姓先民從台南大天后宮分靈而來,已逾三百年。日治時期因日軍闢建軍事基地,村民被迫遷村。"],["m296","六龜天后宮","高雄市",22.9945,120.6434,"六龜區中庄133號",""],["m297","角宿天后宮","高雄市",22.7708,120.3603,"燕巢區角宿路6-1號",""],["m298","旗山朝天宮","高雄市",22.9041,120.48,"旗山區旗文路204號",""],["m299","橋頭五里林天后宮","高雄市",22.7643,120.2935,"橋頭區東林路31號",""],["m300","鼓山龍泉宮","高雄市",22.6529,120.2737,"鼓山區青泉街106號",""],["m301","路竹天后宮","高雄市",22.8663,120.2548,"路竹區聖母街60-1號","路竹天后宮是路竹最大的廟宇，相傳廟中媽祖是明崇禎年間先民渡海來台時隨身攜帶的守護神。現廟經過改建，已不見舊時古貌。"],["m302","苓雅寮安瀾宮","高雄市",22.6153,120.2951,"苓雅區永泰路81號",""],["m303","鹽埕埔朝后宮","高雄市",22.6316,120.2848,"鹽埕區北斗街6號",""],["m304","後驛聖尊宮","高雄市",22.6492,120.3009,"三民區綏遠二街54號",""],["m305","慈仙宮","高雄市",22.7716,120.4478,"大樹區統嶺路91之9號",""],["m306","大港埔鼓壽宮","高雄市",22.627,120.303,"新興區文橫一路90號",""],["m307","本館龍池宮","高雄市",22.6547,120.3275,"三民區大和街66號",""],["m308","高雄港口慈濟宮","高雄市",22.631,120.3428,"苓雅區建軍路166-3號",""],["m309","甲仙代天三安宮", const P={ci:null,tc:null,cloud:false};
const SANDBOX=(typeof claude!=='undefined');
let idb=null;
function lsGet(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function idbOpen(){return new Promise(res=>{try{
  const r=indexedDB.open('mazu_v1',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('checkins',{keyPath:'id'});d.createObjectStore('temples',{keyPath:'id'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null);
}catch(e){res(null)}})}
function idbAll(s){return new Promise(res=>{try{const q=idb.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])}catch(e){res([])}})}
function idbPut(s,o){return new Promise(res=>{try{const t=idb.transaction(s,'readwrite');t.objectStore(s).put(o);t.oncomplete=()=>res(true);t.onerror=()=>res(false);t.onabort=()=>res(false)}catch(e){res(false)}})}
function idbDel(s,id){return new Promise(res=>{try{const t=idb.transaction(s,'readwrite');t.objectStore(s).delete(id);t.oncomplete=()=>res(true);t.onerror=()=>res(false);t.onabort=()=>res(false)}catch(e){res(false)}})}
function setStatus(s){
  const m={connecting:'<svg class="ic" aria-hidden="true"><use href="#i-cloud"/></svg> 連線中…',cloud:'<svg class="ic" aria-hidden="true"><use href="#i-cloud"/></svg> 已雲端存檔',local:'<svg class="ic" aria-hidden="true"><use href="#i-phone"/></svg> 存在這支手機',slow:'<svg class="ic" aria-hidden="true"><use href="#i-cloud"/></svg> 連線較慢…'};
  $('#cloud').innerHTML=m[s]||'';
}

const FBCFG={apiKey:"AIzaSyB3BFp6DncOGFa7eyTOyO5MdVN1E2ZviV8",authDomain:"mazu-map-b3834.firebaseapp.com",projectId:"mazu-map-b3834",storageBucket:"mazu-map-b3834.firebasestorage.app",messagingSenderId:"457434187780",appId:"1:457434187780:web:7957cd5df9617b2d040d51"};
let FBX=null;
async function initFirebase(){
  try{
    const base='https://www.gstatic.com/firebasejs/13.2.0/';
    const [A,Au,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
    const app=A.initializeApp(FBCFG);const auth=Au.getAuth(app);
    await new Promise(r=>{const u=Au.onAuthStateChanged(auth,()=>{u();r()})});
    if(!auth.currentUser)await Au.signInAnonymously(auth);
    const db=F.getFirestore(app);const uid=auth.currentUser.uid;
    FBX={Au,auth};
    const mk=n=>({doc:id=>({set:o=>F.setDoc(F.doc(db,'users',uid,n,id),o),delete:()=>F.deleteDoc(F.doc(db,'users',uid,n,id))}),onSnapshot:(ok,er)=>F.onSnapshot(F.collection(db,'users',uid,n),ok,er)});
    const localCI=checkins.slice(),localTC=custom.slice();
    const ci=mk('checkins'),tc=mk('temples');
    let got=false,migrated=false;
    const timer=setTimeout(()=>{if(!got)setStatus('slow')},10000);
    ci.onSnapshot(s=>{
      if(s.metadata.fromCache&&!got)return;
      const docs=s.docs.map(d=>Object.assign({id:d.id},d.data()));
      if(!got){
        got=true;clearTimeout(timer);P.ci=ci;P.tc=tc;P.cloud=true;setStatus('cloud');
        if(!migrated&&!docs.length&&(localCI.length||localTC.length)){
          migrated=true;
          localCI.forEach(c=>{const o=Object.assign({},c);delete o.id;ci.doc(c.id).set(o).catch(()=>{})});
          localTC.forEach(t=>{const o=Object.assign({},t);delete o.id;tc.doc(t.id).set(o).catch(()=>{})});
          toast('已把這支手機的紀錄搬到雲端');
        }
      }
      checkins=docs;refresh();
    },()=>{clearTimeout(timer);P.ci=null;P.tc=null;P.cloud=false;setStatus('local');refresh()});
    tc.onSnapshot(s=>{if(P.tc){custom=s.docs.map(d=>Object.assign({id:d.id},d.data()));refresh()}},()=>{});
  }catch(e){setStatus('local')}
}
async function linkGoogle(){
  if(!FBX)return;
  const {Au,auth}=FBX;const pr=new Au.GoogleAuthProvider();
  try{
    if(auth.currentUser&&auth.currentUser.isAnonymous){await Au.linkWithPopup(auth.currentUser,pr);toast('已綁定 Google 帳號');refresh()}
  }catch(e){
    if(e&&e.code==='auth/credential-already-in-use'){
      if(confirm('這個 Google 帳號已經有存過資料,要改用它的資料嗎?(這支手機目前的紀錄不會合併)')){
        try{const cr=Au.GoogleAuthProvider.credentialFromError(e);await Au.signInWithCredential(auth,cr);location.reload()}catch(x){toast('綁定失敗')}
      }
    }else if(!(e&&(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request')))toast('綁定失敗,請再試一次');
  }
}

    P.ci.onSnapshot(s=>{
      checkins=s.docs.map(d=>Object.assign({id:d.id},d.data()));
      if(!s.metadata.fromCache){got=true;clearTimeout(timer);P.cloud=true;setStatus('cloud')}
      refresh();
    },async()=>{clearTimeout(timer);P.ci=null;P.tc=null;setStatus('local');await loadLocal();refresh()});
    P.tc.onSnapshot(s=>{custom=s.docs.map(d=>Object.assign({id:d.id},d.data()));refresh()},()=>{});
  }catch(e){setStatus('local')}
}
async function saveCheckin(c){
  if(P.ci){try{const o=Object.assign({},c);delete o.id;await P.ci.doc(c.id).set(o);return true}catch(e){toast('雲端存檔失敗,先存在手機')}}
  let ok;
  if(idb)ok=await idbPut('checkins',c);
  else{const n=[c].concat(checkins.filter(x=>x.id!==c.id));ok=lsSet('mz_ci',n)}
  if(ok)checkins=[c].concat(checkins.filter(x=>x.id!==c.id));
  return ok;
}
async function removeCheckin(id){
  if(P.ci){try{await P.ci.doc(id).delete();return}catch(e){}}
  if(idb)await idbDel('checkins',id);
  checkins=checkins.filter(c=>c.id!==id);
  if(!idb)lsSet('mz_ci',checkins);
}
async function saveTemple(t){
  if(P.tc){try{const o=Object.assign({},t);delete o.id;await P.tc.doc(t.id).set(o);return}catch(e){toast('雲端存檔失敗,先存在手機')}}
  if(idb)await idbPut('temples',t);
  custom=custom.filter(x=>x.id!==t.id).concat([t]);
  if(!idb)lsSet('mz_tc',custom);
}
async function removeTemple(id){
  if(P.tc){try{await P.tc.doc(id).delete();return}catch(e){}}
  if(idb)await idbDel('temples',id);
  custom=custom.filter(t=>t.id!==id);
  if(!idb)lsSet('mz_tc',custom);
}
async function exportBackup(){
  try{
    const data={app:'mazu-checkin',v:1,at:Date.now(),checkins:checkins,temples:custom};
    const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='媽祖廟打卡備份-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();a.remove();
    toast('已匯出備份檔');
  }catch(e){toast('匯出失敗')}
}
async function importBackup(file){
  try{
    const d=JSON.parse(await file.text());
    if(!d||d.app!=='mazu-checkin')throw 0;
    let n=0;
    for(const t of (d.temples||[])){if(!custom.some(x=>x.id===t.id))await saveTemple(t)}
    for(const c of (d.checkins||[])){if(!checkins.some(x=>x.id===c.id)){await saveCheckin(c);n++}}
    toast('已還原 '+n+' 筆紀錄');refresh(true);
  }catch(e){toast('這不是正確的備份檔')}
}

function compress(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{let max=900,qual=.7,out='';
    for(let i=0;i<7;i++){
      const sc=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      out=c.toDataURL('image/jpeg',qual);
      if(out.length<170000)break;max*=.8;qual=Math.max(.45,qual-.05);
    }
    URL.revokeObjectURL(url);res(out)};
  im.onerror=()=>{URL.revokeObjectURL(url);rej()};im.src=url;
})}

}

    if(k==='金門縣'||k==='連江縣')return;
    const p=GEO[k].c;
    L+=`<text x="${p[0]}" y="${p[1]}" font-size="${fs}" text-anchor="middle" fill="#6b5a35" fill-opacity=".8" stroke="#f1e7cf" stroke-width="${fs*.25}" paint-order="stroke" style="pointer-events:none;font-weight:600">${k}</text>`;
  });
  const lb=$('#labels');if(lb)lb.innerHTML=L;
  drawMe();
}
function applyVB(){
  const w=$('#mapwrap');if(!w)return;
  aspect=w.clientHeight/w.clientWidth;
  const h=vb.w*aspect;
  $('#msvg').setAttribute('viewBox',`${vb.cx-vb.w/2} ${vb.cy-h/2} ${vb.w} ${h}`);
  mapDots();
  const lg=$('.leg');if(lg)lg.style.display=vb.w<300?'none':'';
}
function fitVB(){
  const w=$('#mapwrap');aspect=w.clientHeight/w.clientWidth;
  vb.w=Math.max(570,830/aspect);vb.cx=300;vb.cy=415;applyVB();
}
function renderMap(){
  $('#view').innerHTML=`<div id="mapwrap">
   <svg id="msvg" xmlns="http://www.w3.org/2000/svg">
    <rect x="18" y="500" width="112" height="92" rx="8" fill="#eaf3f8" stroke="#9c8a63" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>
    <text x="74" y="586" font-size="12" text-anchor="middle" fill="#9c8a63">金門</text>
    <rect x="18" y="20" width="126" height="134" rx="8" fill="#eaf3f8" stroke="#9c8a63" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>
    <text x="81" y="149" font-size="12" text-anchor="middle" fill="#9c8a63">馬祖</text>
    <g id="ctys">${Object.keys(GEO).map(k=>`<path data-c="${k}" d="${GEO[k].d}" fill="#f6eedb" stroke="#a8956a" stroke-width="1.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`).join('')}</g>
    <g id="labels"></g>
    <g id="dots"></g>
    <g id="me" style="pointer-events:none"></g>
   </svg>
   <div class="leg"><i style="background:#c0392b"></i>還沒去 &nbsp;<i style="background:#2e7d4f"></i>去過了<br><i style="background:#b8741a"></i>數字=附近幾間,點一下放大<br><i style="background:#d9ecd9;border-radius:3px"></i>去過的縣市</div>
   <div class="zb" style="top:70px"><button data-act="zin" aria-label="放大">＋</button><button data-act="zout" aria-label="縮小">－</button><button data-act="zfit" aria-label="看全台" style="font-size:20px">全台</button><button data-act="locate" aria-label="我的位置" style="font-size:26px"><svg class="ic" aria-hidden="true"><use href="#i-pin"/></svg></button></div>
   <div id="mapcard"></div></div>`;
  fitVB();showMapCard();
  const w=$('#mapwrap');let drag=null,moved=0;const pts=new Map();let pinch=null;
  w.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),w:vb.w};drag=null;moved=99}
    else{drag={x:e.clientX,y:e.clientY};moved=0}});
  w.addEventListener('pointermove',e=>{
    if(pts.has(e.pointerId))pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(d>10){vb.w=Math.min(900,Math.max(40,pinch.w*pinch.d/d));applyVB()}return}
    if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved+=Math.abs(dx)+Math.abs(dy);
    if(moved>8){const u=vb.w/w.clientWidth;vb.cx-=dx*u;vb.cy-=dy*u;drag={x:e.clientX,y:e.clientY};applyVB()}
  });
  const end=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;drag=null};
  w.addEventListener('pointerup',end);w.addEventListener('pointercancel',end);
  w.addEventListener('click',e=>{if(moved>8){e.stopPropagation();e.preventDefault()}},true);
  w.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?.8:1.25)},{passive:false});
}
function zoom(f){vb.w=Math.min(900,Math.max(40,vb.w*f));applyVB()}
let myPos=null;
function focusAt(p,w){vb.w=w;vb.cx=p[0];vb.cy=p[1]+w*aspect*.2;applyVB()}
function distKm(a,t){const R=6371,r=Math.PI/180,dl=(t.lat-a.lat)*r,dn=(t.lon-a.lon)*r;const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(t.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function drawMe(){const g=$('#me');if(!g||!myPos)return;const w=$('#mapwrap');const u=vb.w/w.clientWidth;const p=xy(myPos.lat,myPos.lon);
  g.innerHTML=`<circle cx="${p[0]}" cy="${p[1]}" r="${16*u}" fill="#1a73e8" fill-opacity=".2"/><circle cx="${p[0]}" cy="${p[1]}" r="${8*u}" fill="#1a73e8" stroke="#fff" stroke-width="${3*u}"/>`}
function locate(){
  if(!navigator.geolocation){toast('這支手機不能取得位置');return}
  toast('正在找你的位置…');
  navigator.geolocation.getCurrentPosition(p=>{
    myPos={lat:p.coords.latitude,lon:p.coords.longitude};
    const near=allT().filter(t=>t.lat!=null).map(t=>[t,distKm(myPos,t)]).sort((a,b)=>a[1]-b[1]).slice(0,4);
    sel=null;focusAt(xy(myPos.lat,myPos.lon),70);
    const c=$('#mapcard');
    c.innerHTML=`<b style="font-size:22px">離你最近的廟</b>${near.map(([t,d])=>`<button class="near" data-act="dot" data-id="${esc(t.id)}"><b>${esc(t.name)}</b><span>${d.toFixed(1)} 公里 ›</span></button>`).join('')}
      <button class="big plain" style="margin:8px 0 0;min-height:50px" data-act="closecard">收起來</button>`;
    c.classList.add('show');
  },()=>toast('沒辦法取得位置,請確認手機有開「定位」並允許這個網頁使用'),{enableHighAccuracy:true,timeout:15000});
}
function showMapCard(){
  const c=$('#mapcard');if(!c)return;
  const t=sel&&findT(sel);
  if(!t){c.classList.remove('show');return}
  const n=counts()[t.id]||0;
  c.innerHTML=`<b style="font-size:24px">${esc(t.name)}</b><div class="sub" style="margin:0">${esc(t.county)}${t.addr?' '+esc(t.addr):''}${myPos&&t.lat!=null?' · 約 '+distKm(myPos,t).toFixed(1)+' 公里':''}${n?' · 去過 '+n+' 次':''}</div>
   <div class="row"><button class="big red" data-act="checkin" data-id="${esc(t.id)}"><svg class="ic" aria-hidden="true"><use href="#i-camera"/></svg> 打卡</button><button class="big line" data-act="open" data-id="${esc(t.id)}">詳細</button></div>`;
  c.classList.add('show');
}

/* ---------- 畫面:足跡 ---------- */
function ciHTML(c,withName){
  const t=findT(c.tid);
  return `<div class="ci">${withName?`<div class="who">${esc(c.tname||(t&&t.name)||'')}</div>`:''}
   ${c.photo?`<img src="${c.photo}" alt="照片">`:''}
   ${c.text?`<div class="t">${esc(c.text)}</div>`:''}
   <div class="d">${fmt(c.ts)}</div>
   <button class="small" data-act="delci" data-id="${esc(c.id)}">刪除這筆</button></div>`;
}
function renderTrail(){
  const list=checkins.slice().sort((a,b)=>b.ts-a.ts);
  $('#view').innerHTML=`<div class="pad"><h2 style="margin:6px 0;color:var(--red)">我的足跡</h2>
   ${list.map(c=>ciHTML(c,true)).join('')||'<p class="note" style="font-size:20px">還沒有打卡紀錄。<br>到「廟宇」選一間廟,按「來這裡打卡」就會出現在這裡。</p>'}
   ${P.cloud?(FBX&&FBX.auth.currentUser&&FBX.auth.currentUser.isAnonymous?`<p class="note"><svg class="ic" aria-hidden="true"><use href="#i-cloud"/></svg> 紀錄已存到雲端,但目前只綁在這支手機。綁定 Google 帳號後,換手機也找得回來。</p><button class="big" data-act="google"><svg class="ic" aria-hidden="true"><use href="#i-link"/></svg> 綁定 Google 帳號</button>`:''):`<p class="note"><svg class="ic" aria-hidden="true"><use href="#i-phone"/></svg> 紀錄存在這支手機的瀏覽器裡,換手機或清除瀏覽資料就會不見。請偶爾按「備份」存一份。</p>
   <button class="big line" data-act="export"><svg class="ic" aria-hidden="true"><use href="#i-save"/></svg> 備份紀錄</button>
   <button class="big line" data-act="import"><svg class="ic" aria-hidden="true"><use href="#i-folder"/></svg> 還原備份</button>
   <input type="file" id="impf" accept=".json,application/json" style="display:none">`}</div>`;
  const f=$('#impf');if(f)f.onchange=()=>{if(f.files[0])importBackup(f.files[0])};
}

/* ---------- 詳細、打卡、新增 ---------- */
function openDetail(id){
  const t=findT(id);if(!t)return;
  const list=checkins.filter(c=>c.tid===id).sort((a,b)=>b.ts-a.ts);
  openSheet(`<h2>${esc(t.name)}</h2><p class="sub">${esc(t.county)}${t.addr?' · '+esc(t.addr):''}</p>${t.intro?`<p style="line-height:1.7">${esc(t.intro)}</p>`:(t.note?`<p>${esc(t.note)}</p>`:'')}${(!t.intro&&!t.custom)?'<p class="sub">介紹暫缺(目前查不到可靠資料)。</p>':''}
   <button class="big red" data-act="checkin" data-id="${esc(id)}"><svg class="ic" aria-hidden="true"><use href="#i-camera"/></svg> 來這裡打卡</button>
   <a class="big line" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(t.name+' '+t.county+(t.addr||''))}"><svg class="ic" aria-hidden="true"><use href="#i-compass"/></svg> 用 Google 地圖導航</a>
   ${pos(t)?`<button class="big line" data-act="onmap" data-id="${esc(id)}"><svg class="ic" aria-hidden="true"><use href="#i-map"/></svg> 在地圖上看</button>`:''}
   <h3>我的紀錄(${list.length})</h3>
   ${list.map(c=>ciHTML(c,false)).join('')||'<p class="sub">還沒有紀錄,來打第一個卡吧。</p>'}
   ${t.custom?`<button class="small" data-act="deltemple" data-id="${esc(id)}">刪除這間廟(紀錄會保留)</button>`:''}
   <button class="big plain" data-act="close">關閉</button>`);
}
let pending=null;
const CHECKIN_KM=1;
function tryCheckin(id){
  const t=findT(id);if(!t)return;
  if(t.lat==null||t.lon==null){openCheckin(id);return}   // 自己新增、沒有精確位置的廟:無法驗證距離
  if(!navigator.geolocation){toast('這支手機不能取得位置,無法打卡');return}
  toast('正在確認你的位置…');
  navigator.geolocation.getCurrentPosition(p=>{
    myPos={lat:p.coords.latitude,lon:p.coords.longitude};
    const d=distKm(myPos,t);
    if(d<=CHECKIN_KM)openCheckin(id);
    else openSheet(`<h2>還沒到這間廟</h2><p style="font-size:21px;line-height:1.7">你現在離「${esc(t.name)}」約 <b>${d<10?d.toFixed(1):Math.round(d)} 公里</b>。<br>要在廟的 ${CHECKIN_KM} 公里內才能打卡。</p>
      <a class="big red" style="text-decoration:none;display:flex;align-items:center;justify-content:center" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(t.name+' '+t.county+(t.addr||''))}"><svg class="ic" aria-hidden="true"><use href="#i-compass"/></svg> 導航過去</a>
      <button class="big plain" data-act="back" data-id="${esc(id)}">回去</button>`);
  },err=>{
    openSheet(`<h2>無法確認位置</h2><p style="font-size:21px;line-height:1.7">打卡需要確認你在廟附近。請把手機的「定位」打開,並在瀏覽器問你時按「允許」,再試一次。</p>
      <button class="big red" data-act="checkin" data-id="${esc(id)}">再試一次</button>
      <button class="big plain" data-act="back" data-id="${esc(id)}">回去</button>`);
  },{enableHighAccuracy:true,timeout:15000,maximumAge:30000});
}
function openCheckin(id){
  const t=findT(id);if(!t)return;pending=null;
  openSheet(`<h2>打卡:${esc(t.name)}</h2><p class="sub">${fmt(Date.now())}</p>
   <label for="pf" class="big line" style="cursor:pointer"><svg class="ic" aria-hidden="true"><use href="#i-camera"/></svg> 拍照 / 選照片</label>
   <input type="file" id="pf" accept="image/*" style="display:none">
   <div id="prev"></div>
   <label for="tx">今天的心得(可以不寫)</label>
   <textarea id="tx" placeholder="例如:今天來拜拜,平安順利。"></textarea>
   <button class="big red" id="sv" data-id="${esc(id)}"><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg> 存起來</button>
   <button class="big plain" data-act="back" data-id="${esc(id)}">取消</button>`);
  $('#pf').onchange=async e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    $('#prev').innerHTML='<p class="sub">照片處理中…</p>';
    try{pending=await compress(f);$('#prev').innerHTML=`<img src="${pending}" alt="預覽">`}
    catch(x){pending=null;$('#prev').innerHTML='<p class="sub">這張照片讀不了,請換一張。</p>'}
  };
  $('#sv').onclick=async()=>{
    const b=$('#sv');b.disabled=true;b.textContent='存檔中…';
    const c={id:'c'+Date.now(),tid:id,tname:t.name,text:$('#tx').value.trim(),photo:pending||null,ts:Date.now()};
    const ok=await saveCheckin(c);
    closeSheet();toast(ok?'<svg class="ic" aria-hidden="true"><use href="#i-check"/></svg> 已存好':'存檔空間可能不足');refresh();
  };
}
function openAdd(){
  openSheet(`<h2>新增廟宇</h2>
   <label for="nn">廟名</label><input type="text" id="nn" placeholder="例如:○○宮">
   <label for="nc">縣市</label><select id="nc">${Object.keys(COUNTY).map(k=>`<option>${k}</option>`).join('')}</select>
   <label for="nt">備註(可以不寫)</label><input type="text" id="nt">
   <button class="big red" id="na"><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg> 加進清單</button><button class="big plain" data-act="close">取消</button>`);
  $('#na').onclick=async()=>{
    const name=$('#nn').value.trim();if(!name){toast('請先填廟名');return}
    const county=$('#nc').value;
    const t={id:'u'+Date.now().toString(36),name,county,region:COUNTY[county][0],lat:null,lon:null,note:$('#nt').value.trim(),custom:true};
    await saveTemple(t);closeSheet();toast('已加入');refresh();
  };
}

/* ---------- 事件 ---------- */
document.addEventListener('click',e=>{
  const nb=e.target.closest('[data-tab]');
  if(nb){tab=nb.dataset.tab;sel=tab==='map'?sel:sel;refresh(true);return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const id=el.dataset.id,a=el.dataset.act;
  if(a==='close')closeSheet();
  else if(a==='open')openDetail(id);
  else if(a==='checkin')tryCheckin(id);
  else if(a==='back')openDetail(id);
  else if(a==='region'){region=el.dataset.r;cty='';renderList()}
  else if(a==='cty'){cty=el.dataset.r;renderList()}
  else if(a==='addtemple')openAdd();
  else if(a==='dot'){sel=id;const p=pos(findT(id));if(el.closest('#mapcard')&&p)focusAt(p,Math.min(vb.w,70));else applyVB();showMapCard()}
  else if(a==='clu'){vb.cx=+el.dataset.cx;vb.cy=+el.dataset.cy;vb.w=Math.max(60,vb.w*.4);applyVB()}
  else if(a==='locate')locate();
  else if(a==='closecard'){const c=$('#mapcard');if(c)c.classList.remove('show')}
  else if(a==='zin')zoom(.6);
  else if(a==='zout')zoom(1.6);
  else if(a==='zfit')fitVB();
  else if(a==='onmap'){
    closeSheet();tab='map';sel=id;refresh(true);
    const p=pos(findT(id));if(p)focusAt(p,70);
  }
  else if(a==='export')exportBackup();
  else if(a==='google')linkGoogle();
  else if(a==='import'){const f=$('#impf');if(f)f.click()}
  else if(a==='delci')askConfirm('確定要刪除這筆紀錄嗎?刪除後找不回來。','確定刪除',async()=>{await removeCheckin(id);toast('已刪除');refresh()});
  else if(a==='deltemple')askConfirm('確定要刪除這間廟嗎?','確定刪除',async()=>{await removeTemple(id);toast('已刪除');refresh()});
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
window.addEventListener('resize',()=>{if(tab==='map')applyVB()});

function refresh(full){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const m=counts(),all=allT();
  $('#cnt').textContent=`已拜訪 ${all.filter(t=>m[t.id]).length} / ${all.length} 間`;
  if(tab==='list'){
    if(full||!$('#listBody'))renderList();else{listBody();const p=$('.prog');if(p){const d=all.filter(t=>m[t.id]).length;p.innerHTML=`<div style="font-weight:700">已拜訪 ${d} / ${all.length}</div><div class="bar"><i style="width:${all.length?d/all.length*100:0}%"></i></div>`}}
  }else if(tab==='map'){
    if(full||!$('#mapwrap'))renderMap();else{mapDots();showMapCard()}
  }else renderTrail();
}

setStatus('connecting');refresh(true);loadLocal().then(()=>{refresh();return initCloud()});
</script>
</body>
</html>
